name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: apps/api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check example scripts
        run: |
          node --check examples/html-blog/app.js
          node --check examples/html-blog/config.js
          node --check examples/html-blog/server.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build embedded binary
        run: pnpm build:binary
      - name: Smoke test embedded UI
        run: |
          MARKU_ENV=production \
          MARKU_HTTP_ADDR=127.0.0.1:36580 \
          MARKU_DB_DSN=/tmp/marku-ci.db \
          MARKU_DB_AUTO_MIGRATE=true \
          MARKU_JWT_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
          MARKU_IP_HASH_SALT=ci-salt-1234567890 \
          ./dist/marku-api >/tmp/marku-ci.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/marku-ci.log' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:36580/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:36580/healthz
          curl -fsS http://127.0.0.1:36580/ | grep -q 'Marku Admin'
          curl -fsS http://127.0.0.1:36580/docs/ | grep -q '<title>Marku</title>'
          curl -fsS http://127.0.0.1:36580/swagger | grep -q '<title>Marku API</title>'
          kill "$pid"
