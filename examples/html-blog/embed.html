<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Marku Web Component 接入示例：两个标签接入评论、浏览量与点赞。"
    />
    <meta name="marku:api" content="http://localhost:36580/api/v1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Web Component 接入 · Marku Example</title>
    <style>
      .embed-page {
        width: min(720px, calc(100% - 40px));
        margin: 64px auto 96px;
      }
      .embed-page h1 {
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        line-height: 1.2;
        margin: 0 0 12px;
      }
      .embed-page__deck {
        color: var(--muted, #6a6a74);
        margin: 0 0 28px;
      }
      .embed-page__meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 14px 0 24px;
        margin-bottom: 32px;
        border-bottom: 1px solid rgba(20, 20, 24, 0.12);
      }
      .embed-page__note {
        margin: 0 0 32px;
        padding: 12px 16px;
        border-left: 3px solid #2f6f4e;
        background: rgba(47, 111, 78, 0.08);
        font-size: 0.92rem;
      }
      .embed-page__note code {
        font-size: 0.9em;
      }
      marku-comments,
      marku-like,
      marku-stats {
        --marku-font: "Iowan Old Style", "Songti SC", Georgia, serif;
        --marku-accent: #2f6f4e;
        --marku-max-width: 720px;
      }
      marku-comments::part(comment) {
        background: #fffdf8;
      }
    </style>
  </head>
  <body>
    <main class="embed-page">
      <h1>Web Component 接入</h1>
      <p class="embed-page__deck">
        同一篇文章，这次只用了 <code>&lt;marku-comments&gt;</code>、
        <code>&lt;marku-like&gt;</code> 和 <code>&lt;marku-stats&gt;</code>
        三个标签，没有手写任何请求代码。
      </p>

      <div class="embed-page__meta">
        <marku-stats record-view></marku-stats>
        <marku-like></marku-like>
      </div>

      <p class="embed-page__note">
        组件默认使用 Shadow DOM，页面样式不会影响内部结构；上方按钮与下方评论区
        通过 CSS 变量和 <code>::part()</code> 微调。脚本来自
        <code>/embed/v1/marku-embed.js</code>。
      </p>

      <marku-comments
        path="/posts/static-blogs-dynamic-content"
        heading="讨论"
      ></marku-comments>
    </main>

    <script src="/config.js"></script>
    <script type="module">
      const config = window.MARKU_EXAMPLE ?? {}
      const apiBaseUrl = String(config.apiBaseUrl ?? '').replace(/\/+$/, '')
      const siteKey = String(config.siteKey ?? '').trim()

      if (!apiBaseUrl || !siteKey || /replace_with_your/i.test(siteKey)) {
        document.querySelector('marku-comments').outerHTML =
          '<p role="alert">请先在 config.js 配置 apiBaseUrl 与 siteKey。</p>'
      } else {
        for (const element of document.querySelectorAll(
          'marku-comments, marku-like, marku-stats',
        )) {
          element.setAttribute('api', apiBaseUrl)
          element.setAttribute('site-key', siteKey)
        }

        const origin = apiBaseUrl.startsWith('http')
          ? apiBaseUrl.replace(/\/api\/v1\/?$/, '')
          : window.location.origin
        await import(`${origin}/embed/v1/marku-embed.js`)
      }
    </script>
  </body>
</html>
